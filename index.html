<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f4f7fb">
<title>Teaching Games Catalogue</title>
<style>
:root{--ink:#182235;--muted:#637087;--paper:#f5f7fb;--card:#fff;--line:#e3e8f1;--blue:#3768d8;--blue2:#eaf0ff;--mint:#dff6ee;--shadow:0 12px 32px rgba(35,53,88,.08)}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif;min-height:100vh}
header{background:linear-gradient(135deg,#e8efff,#f2f8ff 55%,#e2f7f0);padding:52px 22px 36px;border-bottom:1px solid var(--line)}
.wrap{max-width:1120px;margin:auto}
.kicker{font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--blue)}
h1{font-size:clamp(30px,5vw,48px);line-height:1.08;margin:12px 0 12px;letter-spacing:-.04em}
.subtitle{font-size:16px;color:var(--muted);max-width:680px;line-height:1.6;margin:0}
main{max-width:1120px;margin:0 auto;padding:28px 22px 60px}
.toolbar{display:grid;grid-template-columns:minmax(180px,1fr) 220px 180px;gap:12px;margin-bottom:18px}
input,select{width:100%;min-height:46px;border:1px solid var(--line);border-radius:12px;padding:0 14px;background:#fff;color:var(--ink);font:16px Arial,sans-serif;outline:none}
input:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 3px #3768d81c}
.count{font-size:13px;color:var(--muted);margin:12px 0 18px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;min-width:0;transition:transform .16s ease,box-shadow .16s ease}
.card:hover{transform:translateY(-3px);box-shadow:0 18px 40px rgba(35,53,88,.13)}
.cardtop{position:relative;padding:0;background:linear-gradient(135deg,#eef3ff,#f5fbff);height:178px;min-height:178px;overflow:hidden;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.cardcover{width:100%;height:100%;object-fit:cover;display:block}
.cardtop .pill{position:absolute;top:14px;right:14px;box-shadow:0 2px 10px rgba(20,30,50,.08)}
.cardtop .emoji{position:absolute;left:14px;top:14px}
.emoji{width:54px;height:54px;border-radius:16px;background:#fff;display:grid;place-items:center;font-size:28px;box-shadow:0 5px 14px #18223512;flex-shrink:0}
.pill{font-size:12px;font-weight:700;border-radius:999px;padding:7px 10px;background:var(--mint);color:#17634e;white-space:nowrap}
.cardbody{padding:20px 22px 22px;display:flex;flex-direction:column;flex:1}
.card h2{font-size:20px;line-height:1.3;margin:0 0 9px;letter-spacing:-.02em}
.desc{color:var(--muted);font-size:14px;line-height:1.6;margin:0 0 16px;flex:1}
.meta{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:18px}
.tag{font-size:12px;color:#4e5c72;background:#f1f4f8;border-radius:7px;padding:6px 8px}
.play{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--blue);color:white;text-decoration:none;border-radius:11px;min-height:44px;padding:0 16px;font-weight:700;font-size:14px}
.play:hover{background:#2854bd}
.empty{padding:34px 20px;text-align:center;color:var(--muted);background:#fff;border:1px dashed #ccd5e4;border-radius:16px;grid-column:1/-1}
footer{max-width:1120px;margin:0 auto;padding:0 22px 30px;color:var(--muted);font-size:12px}
@media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.toolbar{grid-template-columns:1fr 1fr}.toolbar input{grid-column:1/-1}}
@media(max-width:560px){header{padding:38px 18px 28px}main{padding:22px 16px 44px}.grid{grid-template-columns:1fr}.toolbar{grid-template-columns:1fr}.toolbar input{grid-column:auto}.cardtop{min-height:112px}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="kicker">Mandarin · Interactive Learning</div>
    <h1>Teaching Games Catalogue</h1>
    <p class="subtitle">A growing library of interactive learning games. Search, filter and launch a game in one click.</p>
  </div>
</header>
<main>
  <div class="toolbar">
    <input id="search" type="search" placeholder="Search games, skills or keywords…" aria-label="Search games">
    <select id="category" aria-label="Filter by category"><option value="">All categories</option></select>
    <select id="level" aria-label="Filter by level"><option value="">All levels</option></select>
  </div>
  <div class="count" id="count" aria-live="polite">Loading games…</div>
  <section class="grid" id="games" aria-label="Game catalogue">
    <div class="empty">Loading games…</div>
  </section>
</main>
<footer>Teaching Games Catalogue · Add new games by uploading the HTML file and updating <code>games.json</code>.</footer>
<script>
const grid = document.getElementById('games');
const search = document.getElementById('search');
const category = document.getElementById('category');
const level = document.getElementById('level');
const count = document.getElementById('count');
let allGames = [];

function escapeHtml(value='') {
  return String(value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}
function fillOptions(select, values, label) {
  const keep = select.value;
  select.innerHTML = `<option value="">${label}</option>` + [...new Set(values.filter(Boolean))].sort().map(v => `<option value="${escapeHtml(v)}">${escapeHtml(v)}</option>`).join('');
  if ([...select.options].some(o => o.value === keep)) select.value = keep;
}
function render() {
  const q = search.value.trim().toLowerCase();
  const c = category.value;
  const l = level.value;
  const filtered = allGames.filter(g => {
    const hay = [g.title,g.description,g.category,g.level,g.language,...(g.tags||[])].join(' ').toLowerCase();
    return (!q || hay.includes(q)) && (!c || g.category === c) && (!l || g.level === l);
  });
  count.textContent = `${filtered.length} game${filtered.length === 1 ? '' : 's'} available`;
  if (!filtered.length) {
    grid.innerHTML = '<div class="empty">No games match your search. Try another keyword or filter.</div>';
    return;
  }
  grid.innerHTML = filtered.map((g,i) => `
    <article class="card">
      <div class="cardtop">
        ${g.image ? `<img class="cardcover" src="${escapeHtml(g.image)}" alt="${escapeHtml(g.title || 'Game')} cover" loading="lazy">` : `<div class="emoji" aria-hidden="true">${escapeHtml(g.emoji || '🎮')}</div>`}
        <span class="pill">${escapeHtml(g.category || 'Learning Game')}</span>
      </div>
      <div class="cardbody">
        <h2>${escapeHtml(g.title || 'Untitled Game')}</h2>
        <p class="desc">${escapeHtml(g.description || 'Interactive learning game.')}</p>
        <div class="meta">
          ${g.level ? `<span class="tag">${escapeHtml(g.level)}</span>` : ''}
          ${(g.tags||[]).slice(0,3).map(t=>`<span class="tag">${escapeHtml(t)}</span>`).join('')}
        </div>
        <a class="play" href="${escapeHtml(g.file)}">Play game <span aria-hidden="true">→</span></a>
      </div>
    </article>`).join('');
}
async function init() {
  try {
    const response = await fetch('./games.json', {cache:'no-store'});
    if (!response.ok) throw new Error('Could not load games.json');
    allGames = await response.json();
    fillOptions(category, allGames.map(g=>g.category), 'All categories');
    fillOptions(level, allGames.map(g=>g.level), 'All levels');
    render();
  } catch (err) {
    count.textContent = 'Catalogue could not load';
    grid.innerHTML = '<div class="empty">Could not load the game list. Please check that <code>games.json</code> is in the same folder as <code>index.html</code> and the site has finished publishing.</div>';
  }
}
search.addEventListener('input',render);
category.addEventListener('change',render);
level.addEventListener('change',render);
init();
</script>
</body>
</html>
